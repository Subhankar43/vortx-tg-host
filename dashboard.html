<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TG-Host Dashboard</title>
<link rel="shortcut icon" href="Main.png" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #06060d;
    --surface: #0d0d1a;
    --surface2: #12121f;
    --border: rgba(255,255,255,0.06);
    --border2: rgba(255,255,255,0.1);
    --accent: #7c6dfa;
    --accent2: #c084fc;
    --blue: #38bdf8;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #eeeef5;
    --muted: #4a4a62;
    --muted2: #6a6a88;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ─── NAV ─── */
  nav {
    background: rgba(13,13,26,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-shrink: 0;
  }

  .nav-logo-icon {
    width: 30px; height: 30px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
  }

  .nav-brand {
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #c084fc, #8b5cf6, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-family: 'Syne', sans-serif;
  }

  .nav-right { display: flex; align-items: center; gap: 0.6rem; }

  #userEmail {
    font-size: 0.75rem;
    color: var(--muted2);
    background: rgba(255,255,255,0.04);
    padding: 0.28rem 0.65rem;
    border-radius: 99px;
    border: 1px solid var(--border);
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .btn-logout {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--muted2);
    padding: 0.32rem 0.8rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.78rem;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-logout:hover { border-color: var(--red); color: var(--red); background: rgba(248,113,113,0.05); }

  /* ─── LAYOUT ─── */
  .container { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem; }

  /* ─── UPLOAD BOX ─── */
  .upload-box {
    background: var(--surface);
    border: 2px dashed rgba(124,109,250,0.2);
    border-radius: 16px;
    padding: 1.8rem 1.5rem;
    text-align: center;
    margin-bottom: 1.2rem;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    overflow: hidden;
  }
  .upload-box::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(124,109,250,0.04) 0%, transparent 70%);
    pointer-events: none;
  }
  .upload-box.drag-over {
    border-color: var(--accent);
    background: rgba(124,109,250,0.05);
  }

  .upload-icon {
    width: 44px; height: 44px;
    background: rgba(124,109,250,0.1);
    border: 1px solid rgba(124,109,250,0.2);
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    margin-bottom: 0.8rem;
  }

  .upload-box p {
    color: var(--muted2);
    font-size: 0.85rem;
    margin-bottom: 1rem;
    line-height: 1.6;
  }
  .upload-box p small { color: var(--muted); font-size: 0.75rem; }

  #fileInput { display: none; }

  .btn-upload {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0.65rem 1.6rem;
    font-size: 0.88rem;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(124,109,250,0.25);
  }
  .btn-upload:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(124,109,250,0.4); }
  .btn-upload:active { transform: translateY(0); }

  /* ─── PROGRESS (real XHR) ─── */
  .progress-wrap { margin-top: 1rem; display: none; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--muted2);
    margin-bottom: 5px;
  }
  .progress-bar {
    background: rgba(255,255,255,0.06);
    border-radius: 99px;
    height: 5px;
    overflow: hidden;
  }
  .progress-fill {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    height: 100%;
    border-radius: 99px;
    width: 0%;
    transition: width 0.15s;
  }
  #uploadStatus {
    margin-top: 0.6rem;
    font-size: 0.78rem;
    color: var(--muted2);
  }

  /* ─── SEARCH BAR ─── */
  .search-wrap {
    position: relative;
    margin-bottom: 1rem;
  }
  .search-icon {
    position: absolute;
    left: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.85rem;
    color: var(--muted);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 0.65rem 1rem 0.65rem 2.4rem;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #searchInput::placeholder { color: var(--muted); }
  #searchInput:focus { border-color: var(--accent); }
  .search-clear {
    position: absolute;
    right: 0.7rem;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.06);
    border: none;
    color: var(--muted2);
    font-size: 0.75rem;
    cursor: pointer;
    border-radius: 4px;
    padding: 0.15rem 0.35rem;
    display: none;
  }
  #searchInput:not(:placeholder-shown) + .search-clear { display: block; }

  /* ─── BULK BAR ─── */
  .bulk-bar {
    display: none;
    background: rgba(124,109,250,0.06);
    border: 1px solid rgba(124,109,250,0.2);
    border-radius: 12px;
    padding: 0.65rem 1rem;
    margin-bottom: 1rem;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    animation: fadeIn 0.2s ease;
    flex-wrap: wrap;
  }
  .bulk-bar.show { display: flex; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  /* ─── SECTION HEADER ─── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }
  .section-title {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 500;
  }
  #noResults {
    display: none;
    text-align: center;
    color: var(--muted);
    padding: 2.5rem;
    font-size: 0.85rem;
    border: 1px dashed var(--border);
    border-radius: 12px;
    margin-bottom: 0.5rem;
  }

  /* ─── FILE LIST ─── */
  .file-list { display: flex; flex-direction: column; gap: 7px; }

  .file-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.8rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    transition: border-color 0.2s, background 0.2s;
  }
  .file-item:hover { border-color: rgba(124,109,250,0.2); background: var(--surface2); }

  .checkbox-col { width: 1.2rem; flex-shrink: 0; }
  .file-checkbox {
    width: 14px; height: 14px;
    cursor: pointer;
    accent-color: var(--accent);
  }

  .file-icon {
    width: 36px; height: 36px;
    border-radius: 9px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }

  .file-info { flex: 1; min-width: 0; }
  .file-name {
    font-size: 0.85rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .file-meta { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

  .file-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .btn-sm {
    padding: 0.32rem 0.65rem;
    border-radius: 7px;
    font-size: 0.7rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: 'DM Sans', sans-serif;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  .btn-preview { background: rgba(56,189,248,0.08); color: var(--blue); border: 1px solid rgba(56,189,248,0.15); }
  .btn-preview:hover { background: rgba(56,189,248,0.15); border-color: var(--blue); }

  .btn-copy { background: rgba(124,109,250,0.08); color: #a78bfa; border: 1px solid rgba(124,109,250,0.15); }
  .btn-copy:hover { background: rgba(124,109,250,0.15); }

  .btn-download { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .btn-download:hover { opacity: 0.85; }

  .btn-delete { background: rgba(248,113,113,0.07); color: var(--red); border: 1px solid rgba(248,113,113,0.15); }
  .btn-delete:hover { background: rgba(248,113,113,0.15); }

  .btn-sm.btn-select-all { background: rgba(124,109,250,0.08); color: #a78bfa; border: 1px solid rgba(124,109,250,0.2); }
  .btn-sm.btn-bulk-del { background: rgba(248,113,113,0.08); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 3rem;
    font-size: 0.85rem;
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
  .empty .empty-icon { font-size: 2.2rem; margin-bottom: 0.65rem; opacity: 0.5; }

  /* ─── TOAST ─── */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    padding: 0.6rem 1rem;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 500;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.3s ease;
    pointer-events: none;
    z-index: 9999;
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    max-width: calc(100vw - 3rem);
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ─── MODAL ─── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 1rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 16px;
    max-width: 820px;
    width: 100%;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6);
    transform: scale(0.97);
    transition: transform 0.25s;
  }
  .modal-overlay.open .modal { transform: scale(1); }

  .modal-header {
    padding: 0.9rem 1.2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 0.5rem;
  }
  .modal-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .modal-close {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: var(--muted2);
    font-size: 0.85rem;
    cursor: pointer;
    width: 26px; height: 26px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .modal-close:hover { background: rgba(248,113,113,0.1); color: var(--red); border-color: rgba(248,113,113,0.2); }

  .modal-body {
    padding: 1.2rem;
    overflow: auto;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 150px;
  }
  .modal-body img { max-width:100%; max-height:68vh; border-radius:8px; object-fit:contain; }
  .modal-body video { max-width:100%; max-height:68vh; border-radius:8px; }
  .modal-body audio { width:100%; }
  .modal-body iframe { width:100%; height:62vh; border:none; border-radius:8px; background:#fff; }
  .modal-body .no-preview { text-align:center; color:var(--muted2); padding:2rem; }
  .modal-body .no-preview .icon { font-size:2.8rem; margin-bottom:0.8rem; }

  .modal-footer {
    padding: 0.8rem 1.2rem;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 0.6rem;
    justify-content: flex-end;
    flex-shrink: 0;
  }

  /* ─── MOBILE ─── */
  @media (max-width: 600px) {
    nav { padding: 0 1rem; }
    .nav-brand { font-size: 1.1rem; }
    #userEmail { display: none; }

    .container { padding: 1rem 0.75rem; }

    .upload-box { padding: 1.4rem 1rem; }
    .upload-box p { font-size: 0.8rem; }

    .file-item {
      flex-wrap: wrap;
      gap: 0.6rem;
      padding: 0.75rem 0.85rem;
    }
    .file-info { min-width: 0; flex: 1; }
    .file-actions {
      width: 100%;
      justify-content: flex-start;
      padding-left: calc(1.2rem + 36px + 0.75rem); /* align with file-name */
    }

    .btn-sm { font-size: 0.68rem; padding: 0.28rem 0.55rem; }

    .modal { border-radius: 14px; max-height: 95vh; }
    .modal-body { padding: 0.8rem; }
    .modal-body img, .modal-body video { max-height: 55vh; }
    .modal-body iframe { height: 50vh; }

    .toast { bottom: 1rem; right: 1rem; left: 1rem; text-align: center; }

    .bulk-bar { font-size: 0.78rem; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <div class="nav-logo-icon">⬡</div>
    <span class="nav-brand">Vortx</span>
  </div>
  <div class="nav-right">
    <span id="userEmail"></span>
    <button class="btn-logout" onclick="logout()">Sign out</button>
  </div>
</nav>

<div class="container">

  <!-- Upload Zone -->
  <div class="upload-box" id="dropZone">
    <div class="upload-icon">📤</div>
    <p>Upload any file — image, audio, video, PDF, ZIP and more<br><small>Drag & drop or click below · Max 50MB per file</small></p>
    <input type="file" id="fileInput" multiple onchange="uploadFiles(this)" />
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">Choose Files</button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label">
        <span id="progressFileName">Uploading...</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <div id="uploadStatus"></div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search files by name..." oninput="filterFiles(this.value)" />
    <button class="search-clear" onclick="clearSearch()">✕</button>
  </div>
  <div id="noResults">No files match your search.</div>

  <!-- Bulk Bar -->
  <div class="bulk-bar" id="bulkBar">
    <span id="bulkCount" style="font-size:0.8rem;color:#a78bfa;font-weight:500"></span>
    <div style="display:flex;gap:0.4rem;flex-wrap:wrap">
      <button class="btn-sm btn-select-all" onclick="selectAll()">Select All</button>
      <button class="btn-sm btn-bulk-del" onclick="bulkDelete()">🗑 Delete Selected</button>
    </div>
  </div>

  <!-- Today Files -->
  <div class="section-header">
    <span class="section-title" id="todayTitle">Your Files — Today</span>
  </div>
  <div class="file-list" id="fileList">
    <div class="empty"><div class="empty-icon">📭</div>Loading your files...</div>
  </div>

  <!-- History -->
  <div id="historySection" style="display:none">
    <div class="section-header" style="margin-top:1.5rem">
      <span class="section-title">📁 History</span>
    </div>
    <div class="file-list" id="historyList"></div>
  </div>

</div>

<!-- Preview Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalIfOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Preview</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn-sm btn-copy" onclick="copyCurrentUrl()">📋 Copy URL</button>
      <a class="btn-sm btn-download" id="modalDownloadBtn" href="#" target="_blank">⬇ Download</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentPreviewFile = null;
let allFiles = [];

/* ─── INIT ─── */
async function init() {
  const res = await fetch('/api/me');
  if (!res.ok) { window.location.href = '/login.html'; return; }
  const data = await res.json();
  document.getElementById('userEmail').textContent = data.email;
  loadFiles();
  setupDragDrop();
  setInterval(async () => {
    const r = await fetch('/api/me');
    if (!r.ok) window.location.href = '/login.html';
  }, 15000);
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/index.html';
}

/* ─── LOAD FILES ─── */
async function loadFiles() {
  const res = await fetch('/api/files');
  if (!res.ok) {
    document.getElementById('fileList').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Failed to load files.</div>';
    return;
  }
  const data = await res.json();
  allFiles = data.files || [];
  renderFiles(allFiles);
}

function renderFiles(files) {
  const today = new Date().toDateString();
  const todayFiles = files.filter(f => new Date(f.uploadedAt).toDateString() === today).sort((a,b) => b.uploadedAt - a.uploadedAt);
  const olderFiles = files.filter(f => new Date(f.uploadedAt).toDateString() !== today).sort((a,b) => b.uploadedAt - a.uploadedAt);

  const list = document.getElementById('fileList');
  list.innerHTML = '';
  if (todayFiles.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>No files uploaded today.</div>';
  } else {
    todayFiles.forEach(f => list.appendChild(makeFileItem(f)));
  }

  const historySection = document.getElementById('historySection');
  const historyList = document.getElementById('historyList');
  if (olderFiles.length > 0) {
    historySection.style.display = 'block';
    historyList.innerHTML = '';
    olderFiles.forEach(f => historyList.appendChild(makeFileItem(f)));
  } else {
    historySection.style.display = 'none';
  }
}

/* ─── SEARCH ─── */
function filterFiles(query) {
  const q = query.trim().toLowerCase();
  const noResults = document.getElementById('noResults');

  if (!q) {
    renderFiles(allFiles);
    noResults.style.display = 'none';
    return;
  }

  const filtered = allFiles.filter(f => f.fileName.toLowerCase().includes(q));
  noResults.style.display = filtered.length === 0 ? 'block' : 'none';
  renderFiles(filtered);
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  filterFiles('');
}

/* ─── FILE ITEM ─── */
function getIcon(mime) {
  if (!mime) return '📄';
  if (mime.startsWith('image/')) return '🖼️';
  if (mime.startsWith('video/')) return '🎬';
  if (mime.startsWith('audio/')) return '🎵';
  if (mime === 'application/pdf') return '📕';
  if (mime.includes('zip') || mime.includes('rar') || mime.includes('7z')) return '🗜️';
  if (mime.includes('word') || mime.includes('document')) return '📝';
  if (mime.includes('sheet') || mime.includes('excel')) return '📊';
  return '📄';
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function makeFileItem(f) {
  const url = `${window.location.origin}/file/${f.fileId}`;
  const div = document.createElement('div');
  div.className = 'file-item';
  div.dataset.fileId = f.fileId;
  div.innerHTML = `
    <div class="checkbox-col">
      <input type="checkbox" class="file-checkbox" data-id="${f.fileId}" onchange="onCheckChange()">
    </div>
    <div class="file-icon">${getIcon(f.mimeType)}</div>
    <div class="file-info">
      <div class="file-name">${f.fileName}</div>
      <div class="file-meta">${formatSize(f.fileSize)} · ${new Date(f.uploadedAt).toLocaleString()}</div>
    </div>
    <div class="file-actions">
      <button class="btn-sm btn-preview" onclick='openPreview(${JSON.stringify(f)})'>👁 Preview</button>
      <button class="btn-sm btn-copy" onclick="copyUrl('${url}','${f.fileId}')">📋 Copy</button>
      <a class="btn-sm btn-download" href="${url}?download=1" target="_blank">⬇</a>
      <button class="btn-sm btn-delete" onclick="deleteFile('${f.fileId}', this)">🗑</button>
    </div>
  `;
  return div;
}

/* ─── PREVIEW ─── */
function openPreview(f) {
  currentPreviewFile = f;
  document.getElementById('modalTitle').textContent = f.fileName;
  const fileUrl = `${window.location.origin}/file/${f.fileId}`;
  document.getElementById('modalDownloadBtn').href = fileUrl + '?download=1';

  const body = document.getElementById('modalBody');
  body.innerHTML = '';
  const mime = f.mimeType || '';

  if (mime.startsWith('image/')) {
    const img = document.createElement('img');
    img.src = fileUrl; img.alt = f.fileName;
    body.appendChild(img);
  } else if (mime.startsWith('video/')) {
    const vid = document.createElement('video');
    vid.src = fileUrl; vid.controls = true;
    body.appendChild(vid);
  } else if (mime.startsWith('audio/')) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'text-align:center;width:100%';
    wrap.innerHTML = `<div style="font-size:2.8rem;margin-bottom:0.8rem">🎵</div><p style="color:#888;margin-bottom:0.8rem;font-size:0.82rem">${f.fileName}</p>`;
    const aud = document.createElement('audio');
    aud.src = fileUrl; aud.controls = true; aud.style.width = '100%';
    wrap.appendChild(aud);
    body.appendChild(wrap);
  } else if (mime === 'application/pdf' || mime.startsWith('text/')) {
    const iframe = document.createElement('iframe');
    iframe.src = fileUrl;
    body.appendChild(iframe);
  } else {
    body.innerHTML = `
      <div class="no-preview">
        <div class="icon">${getIcon(mime)}</div>
        <p style="color:#888;margin-bottom:0.8rem">${f.fileName}</p>
        <p style="color:#555;font-size:0.82rem">Preview not available.<br>Download to view this file.</p>
      </div>`;
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  const vid = document.querySelector('#modalBody video');
  const aud = document.querySelector('#modalBody audio');
  if (vid) vid.pause();
  if (aud) aud.pause();
}

function closeModalIfOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function copyCurrentUrl() {
  if (!currentPreviewFile) return;
  const url = `${window.location.origin}/file/${currentPreviewFile.fileId}`;
  navigator.clipboard.writeText(url).then(() => showToast('✅ URL copied!'));
}

function copyUrl(url, fileId) {
  navigator.clipboard.writeText(url).then(() => showToast('✅ URL copied!'));
}

/* ─── DELETE ─── */
async function deleteFile(fileId, btn) {
  if (!confirm('Delete this file?')) return;
  btn.textContent = '...';
  const res = await fetch('/api/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fileId })
  });
  if (res.ok) {
    // Remove from allFiles array and re-render
    allFiles = allFiles.filter(f => f.fileId !== fileId);
    const q = document.getElementById('searchInput').value;
    filterFiles(q);
    showToast('File deleted.');
  } else {
    btn.textContent = '🗑';
    showToast('Delete failed.');
  }
}

/* ─── UPLOAD with real XHR progress ─── */
async function uploadFiles(input) {
  const files = Array.from(input.files);
  if (!files.length) return;

  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressPct = document.getElementById('progressPct');
  const progressFileName = document.getElementById('progressFileName');
  const status = document.getElementById('uploadStatus');
  const list = document.getElementById('fileList');

  for (const file of files) {
    if (file.size > 50 * 1024 * 1024) {
      showToast(`❌ ${file.name} — exceeds 50MB`);
      continue;
    }

    // Instant temp UI
    const tempFile = {
      fileId: 'temp_' + Date.now() + Math.random(),
      fileName: file.name,
      fileSize: file.size,
      mimeType: file.type,
      uploadedAt: Date.now()
    };
    const empty = list.querySelector('.empty');
    if (empty) empty.remove();
    const tempEl = makeFileItem(tempFile);
    tempEl.style.opacity = '0.55';
    tempEl.style.borderColor = 'rgba(124,109,250,0.4)';
    list.prepend(tempEl);

    // Show progress
    progressWrap.style.display = 'block';
    progressFill.style.width = '0%';
    progressPct.textContent = '0%';
    progressFileName.textContent = file.name;
    status.textContent = '';

    try {
      const result = await xhrUpload(file, (pct) => {
        progressFill.style.width = pct + '%';
        progressPct.textContent = pct + '%';
      });

      // Replace temp with real
      const realFile = {
        fileId: result.fileId,
        fileName: result.fileName,
        fileSize: result.fileSize,
        mimeType: result.mimeType,
        uploadedAt: Date.now()
      };
      allFiles.unshift(realFile);
      tempEl.replaceWith(makeFileItem(realFile));
      showToast(`✅ ${file.name} uploaded`);

    } catch (err) {
      tempEl.remove();
      showToast(`❌ ${file.name}: ${err}`);
    }

    progressFill.style.width = '100%';
    progressPct.textContent = '100%';
    await new Promise(r => setTimeout(r, 600));
    progressWrap.style.display = 'none';
    progressFill.style.width = '0%';
  }

  status.textContent = '';
  input.value = '';
}

function xhrUpload(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    const formData = new FormData();
    formData.append('file', file);

    xhr.upload.addEventListener('progress', (e) => {
      if (e.lengthComputable) {
        onProgress(Math.round((e.loaded / e.total) * 100));
      }
    });

    xhr.addEventListener('load', () => {
      try {
        const data = JSON.parse(xhr.responseText);
        if (xhr.status >= 200 && xhr.status < 300) resolve(data);
        else reject(data.error || 'Upload failed');
      } catch {
        reject('Invalid server response');
      }
    });

    xhr.addEventListener('error', () => reject('Network error'));
    xhr.open('POST', '/api/upload');
    xhr.send(formData);
  });
}

/* ─── DRAG & DROP ─── */
function setupDragDrop() {
  const zone = document.getElementById('dropZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over'); });
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const droppedFiles = e.dataTransfer.files;
    if (droppedFiles.length) {
      const dt = new DataTransfer();
      Array.from(droppedFiles).forEach(f => dt.items.add(f));
      const input = document.getElementById('fileInput');
      input.files = dt.files;
      uploadFiles(input);
    }
  });
}

/* ─── BULK SELECT ─── */
function onCheckChange() {
  const checked = document.querySelectorAll('.file-checkbox:checked');
  const bar = document.getElementById('bulkBar');
  if (checked.length > 0) {
    bar.classList.add('show');
    document.getElementById('bulkCount').textContent = `${checked.length} selected`;
  } else {
    bar.classList.remove('show');
  }
}

function selectAll() {
  const all = document.querySelectorAll('.file-checkbox');
  const allChecked = Array.from(all).every(c => c.checked);
  all.forEach(c => { c.checked = !allChecked; });
  onCheckChange();
}

async function bulkDelete() {
  const checked = document.querySelectorAll('.file-checkbox:checked');
  if (!checked.length) return;
  if (!confirm(`Delete ${checked.length} file(s)?`)) return;

  const ids = Array.from(checked).map(c => c.dataset.id);
  for (const fileId of ids) {
    await fetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileId })
    });
    allFiles = allFiles.filter(f => f.fileId !== fileId);
  }

  document.getElementById('bulkBar').classList.remove('show');
  const q = document.getElementById('searchInput').value;
  filterFiles(q);
  showToast(`🗑 ${ids.length} file(s) deleted.`);
}

/* ─── TOAST ─── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

init();
</script>
